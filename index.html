<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complimentary Sephora eGift Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f5f7;
    font-family:'Montserrat',sans-serif;
	-webkit-font-smoothing:antialiased;
	-moz-osx-font-smoothing:grayscale;
    color:#222;
}

.wrapper{

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

}

.card{

    width:100%;
    max-width:430px;

    background:#fff;

    border-radius:22px;

    box-shadow:0 18px 45px rgba(0,0,0,.10);

    overflow:hidden;

}

.header{

    text-align:center;

    padding:22px 20px 15px;

}

.badge{

    display:inline-block;

    background:#111;

    color:#fff;

    padding:7px 16px;

    border-radius:40px;

    font-size:13px;

    letter-spacing:.4px;

    margin-bottom:15px;

}

.header h1{

    font-size:30px;

    margin-bottom:6px;

}

.header p{

    color:#666;

    font-size:14px;

}

.gift{

    padding:0 18px;

}

.gift img{

    width:100%;

    display:block;

    border-radius:14px;

    border:1px solid #ddd;

}

.value{

    text-align:center;

    margin-top:18px;

}

.value h2{

    font-size:22px;

}

.value p{

    color:#777;

    margin-top:5px;

}

.details{

    margin:22px 20px;

    background:#fafafa;

    border:1px solid #ececec;

    border-radius:12px;

    padding:18px;

}

.row{

    display:flex;

    justify-content:space-between;

    margin-bottom:12px;

}

.row:last-child{

    margin-bottom:0;

}

.label{

    color:#666;

}

.valueText{

    font-weight:bold;

}

.buttonArea{

    padding:0 20px 20px;

}

.claim{

display:block;
width:100%;

background:#000;
color:#fff;

text-decoration:none;

text-align:center;

padding:18px;

border-radius:14px;

font-size:18px;

font-weight:700;

letter-spacing:.8px;

transition:.25s ease;

}

.claim:hover{

background:#222;

transform:translateY(-1px);

}

.instructions{

    text-align:center;

    padding:0 22px 18px;

}

.instructions h3{

    margin-bottom:10px;

}

.instructions p{

    color:#666;

    line-height:1.6;

}

.support{

    background:#fafafa;

    border-top:1px solid #eee;

    padding:22px;

    text-align:center;

}

.support h3{

    margin-bottom:10px;

}

.phone{

    display:block;

    margin:14px 0;

    text-decoration:none;

    color:#111;

    font-size:28px;

    font-weight:bold;

}

.call{

    display:inline-block;

    background:#0d6efd;

    color:#fff;

    text-decoration:none;

    padding:14px 26px;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    margin-top:10px;

}

.footer{

    text-align:center;

    color:#777;

    font-size:13px;

    padding:18px;

    line-height:1.5;

}

@media(max-height:760px){

.header h1{
font-size:26px;
}

.value h2{
font-size:30px;
}

.phone{
font-size:24px;
}

.claim{
padding:16px;
}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="card">

<div class="header">

<div class="badge">
🎁 Card Sent Succesfully
</div>

<h1>Sephora eGift Card</h1>

</div>

<div class="gift">

<!-- Replace with your own hosted image -->
<img src="https://i.ibb.co/5xR4fb7n/sepcard.png" alt="Sephora Gift Card">

</div>

<div class="value">

<h2>July 31st, 2026</h2>

</div>

<div class="details">

<div class="row">
<div class="label">Card Number</div>
<div class="valueText">4102 3360 5872 7634</div>
</div>

<div class="row">
<div class="label">PIN</div>
<div class="valueText">****7109</div>
</div>

</div>

<div class="buttonArea">

<a class="claim" href="tel:+18083723347">
☎ CALL 1-808-372-3347
</a>

</div>

<div class="instructions">
<h3>Need Help?</h3>

<p>

You've sent Seophora eGift card for 500.00 USD<br>
Delivery <strong>Online Instant </strong>

</p>

</div>

<div class="footer">

Seophora INC ™ 

<strong> ☎ 1-808-372-3347</strong>

</div>

</div>

</div>

</body>

</html>
